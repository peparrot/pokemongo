<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポイント持ち越し計算機</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: one narrow column, phone first. input card -> big result -> step ledger */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --ink: #1b2540;
  --muted: #5f6b85;
  --line: #d8deea;
  --accent: #3454d1;
  --accent-ink: #ffffff;
  --gain: #0f7a5a;
  --gain-bg: #dff3ea;
  --spend: #b4530b;
  --spend-bg: #fbe9d6;
  --font-display: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
  --font-body: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111626;
    --surface: #1a2136;
    --ink: #e8ecf7;
    --muted: #9aa5c0;
    --line: #2e3854;
    --accent: #8ea4ff;
    --accent-ink: #0e1430;
    --gain: #6fd6b0;
    --gain-bg: #153a30;
    --spend: #f2b074;
    --spend-bg: #40290f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111626;
  --surface: #1a2136;
  --ink: #e8ecf7;
  --muted: #9aa5c0;
  --line: #2e3854;
  --accent: #8ea4ff;
  --accent-ink: #0e1430;
  --gain: #6fd6b0;
  --gain-bg: #153a30;
  --spend: #f2b074;
  --spend-bg: #40290f;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
}
main {
  max-width: 520px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
h1 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1.4rem;
  margin: 4px 0 0;
  text-wrap: balance;
}
h2 {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 1rem;
  margin: 0;
}
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
label { display: flex; flex-direction: column; gap: 4px; font-size: .85rem; color: var(--muted); font-weight: 500; }
input[type="number"], input[type="text"] {
  font: inherit;
  font-size: 1.05rem;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px 12px;
  width: 100%;
  min-width: 0;
}
input:focus-visible, button:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}
.main-input input { font-family: var(--font-display); font-weight: 800; font-size: 1.6rem; padding: 12px 14px; }
.presets { display: flex; flex-wrap: wrap; gap: 8px; }
.presets button {
  font: inherit; font-size: .9rem; font-weight: 700; font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer;
}
[hidden] { display: none !important; }
.presets button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.req-rows { display: flex; flex-direction: column; gap: 8px; }
.req-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.req-row .name { font-weight: 700; font-variant-numeric: tabular-nums; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button {
  font: inherit; font-size: 1.2rem; font-weight: 700; line-height: 1; color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  width: 44px; height: 40px; cursor: pointer;
}
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper output { min-width: 3.2em; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.group-label { font-size: .85rem; color: var(--muted); font-weight: 500; margin: 0 0 6px; }
.tag { font-size: .72rem; font-weight: 700; color: var(--muted); margin-left: 6px; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
details summary { cursor: pointer; font-weight: 700; font-size: .95rem; color: var(--accent); }
details[open] summary { margin-bottom: 12px; }
details.card { display: block; }
.hint { font-size: .78rem; color: var(--muted); margin: 0; }
.result {
  background: var(--accent);
  color: var(--accent-ink);
  border-radius: 14px;
  padding: 18px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.result .cap { font-size: .85rem; font-weight: 500; opacity: .9; }
.result .big {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: 2.8rem;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
}
.result .big small { font-size: 1.1rem; margin-left: 2px; }
.result .sub { font-size: .85rem; display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.error {
  background: var(--spend-bg);
  color: var(--spend);
  border-radius: 14px;
  padding: 14px 16px;
  font-weight: 500;
}
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .95rem; }
th { text-align: right; font-size: .75rem; color: var(--muted); font-weight: 500; padding: 4px 6px 8px; white-space: nowrap; }
th:nth-child(1), th:nth-child(2) { text-align: left; }
td { padding: 9px 6px; border-top: 1px solid var(--line); text-align: right; white-space: nowrap; }
td:nth-child(1) { text-align: left; color: var(--muted); width: 2em; }
td:nth-child(2) { text-align: left; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-weight: 700; font-size: .88rem; }
.pill.gain { background: var(--gain-bg); color: var(--gain); }
.pill.spend { background: var(--spend-bg); color: var(--spend); }
tr.last td { font-weight: 700; }
.rules { margin: 0; padding-left: 1.2em; font-size: .85rem; color: var(--muted); }
.rules li + li { margin-top: 4px; }
</style>
</head>
<body>
<main>
  <h1>ポイント持ち越し計算機</h1>

  <section class="card" aria-label="入力">
    <label class="main-input" for="hold">いまの所持ポイント
      <input type="number" id="hold" inputmode="numeric" min="0" step="1" value="1730">
    </label>
    <div>
      <label for="remain">残り受け取れるポイント
        <input type="number" id="remain" inputmode="numeric" min="0" step="1" value="3200">
      </label>
      <div class="presets" id="cap-group" role="group" aria-label="残り受け取れるポイントをまとめて入力" style="margin-top:8px">
        <button type="button" data-cap="800">800</button>
        <button type="button" data-cap="1600">1600</button>
        <button type="button" data-cap="2400">2400</button>
        <button type="button" data-cap="3200">3200</button>
      </div>
    </div>
    <div>
      <p class="group-label" id="preset-label">受け取りパターン</p>
      <div class="presets" id="preset-group" role="group" aria-labelledby="preset-label">
        <button type="button" id="preset-a" data-a="820" data-b="600" data-f="0">820 / 600</button>
        <button type="button" id="preset-b" data-a="820" data-b="600" data-f="300">820 / 600（初回300）</button>
        <button type="button" id="preset-c" data-a="300" data-b="120" data-f="0">300 / 120</button>
      </div>
    </div>
    <div class="presets" id="first-row" hidden>
      <button type="button" id="usedFirst" aria-pressed="false">初回分はもう受け取った</button>
    </div>
    <div>
      <p class="group-label" id="unit-label">消化に使う単位（複数選べます）</p>
      <div class="presets" id="unit-group" role="group" aria-labelledby="unit-label">
        <button type="button" data-u="250" aria-pressed="true">250</button>
        <button type="button" data-u="400" aria-pressed="true">400</button>
        <button type="button" data-u="800" aria-pressed="true">800</button>
      </div>
    </div>
    <div>
      <p class="group-label" id="req-label">必ず消化する回数（なければ0のまま）</p>
      <div class="req-rows" id="req-rows" role="group" aria-labelledby="req-label"></div>
    </div>
    <details id="settings">
      <summary>ルール設定を変える</summary>
      <div class="grid">
        <label for="recvA">受け取り額 A
          <input type="number" id="recvA" inputmode="numeric" min="1" step="1" value="820">
        </label>
        <label for="recvB">受け取り額 B
          <input type="number" id="recvB" inputmode="numeric" min="0" step="1" value="600">
        </label>
        <label for="firstB">Bの初回だけの額
          <input type="number" id="firstB" inputmode="numeric" min="0" step="1" value="0">
        </label>
        <label for="units">消化の単位（手入力）
          <input type="text" id="units" inputmode="text" autocomplete="off" value="250, 400, 800">
        </label>
        <label for="capHold">所持の上限
          <input type="number" id="capHold" inputmode="numeric" min="0" step="1" value="1500">
        </label>
      </div>
      <p class="hint" style="margin-top:10px">受け取り額が1種類だけなら、Bを0に。「Bの初回だけの額」は、Bの1回目だけ額が変わるとき用です（変わらないなら0）。250・400・800以外の単位で消化するときは、「消化の単位（手入力）」に「100, 250」のようにカンマ区切りで入れてください。</p>
    </details>
  </section>

  <div id="out"></div>

  <details class="card" id="premise">
    <summary>計算の前提を見る</summary>
    <ul class="rules" id="rules"></ul>
  </details>
</main>

<script>
/*SOLVER-START*/
function solve(p) {
  var hasB = p.recvB > 0;
  var memo = new Map();
  var req0 = p.units.map(function (u, i) { return (p.req && p.req[i]) || 0; });
  // c: points received from now on; receiving is allowed while c < p.remain.
  // f: 1 once the B slot has been used.
  // rem: how many more times each unit still has to be consumed (same order as p.units).
  // returns [bestFinalHold, totalReceivedAtEnd, stepsNeeded, action]; bestFinalHold is -Infinity when rem cannot be met
  // priority: bigger final hold, then bigger total received, then fewer steps
  // action: 0 = stop, negative = consume unit index (-(i+1)), 1 = receive A, 2 = receive B
  function bAmount(f) { return (!f && p.firstB > 0) ? p.firstB : p.recvB; }
  function go(h, c, f, rem) {
    var key = h + "," + c + "," + f + "," + rem.join(".");
    var hit = memo.get(key);
    if (hit) return hit;
    var done = rem.every(function (n) { return n === 0; });
    var best = done ? [h, c, 0, 0] : [-Infinity, c, 0, 0];
    function consider(r, act) {
      if (r[0] === -Infinity) return;
      if (r[0] > best[0] ||
          (r[0] === best[0] && (r[1] > best[1] || (r[1] === best[1] && r[2] + 1 < best[2])))) {
        best = [r[0], r[1], r[2] + 1, act];
      }
    }
    if (h <= p.capHold && c < p.remain) {
      consider(go(h + p.recvA, c + p.recvA, f, rem), 1);
      if (hasB) { var b = bAmount(f); consider(go(h + b, c + b, 1, rem), 2); }
    }
    for (var i = 0; i < p.units.length; i++) {
      if (h >= p.units[i]) {
        var next = rem;
        if (rem[i] > 0) { next = rem.slice(); next[i]--; }
        consider(go(h - p.units[i], c, f, next), -(i + 1));
      }
    }
    memo.set(key, best);
    return best;
  }
  var h = p.hold, c = 0, f = p.usedFirst ? 1 : 0, rem = req0, steps = [];
  var r = go(h, c, f, rem);
  var final = r[0];
  if (final === -Infinity) return { final: null, steps: [], total: 0 };
  while (r[3] !== 0) {
    if (r[3] < 0) {
      var i = -r[3] - 1;
      var forced = rem[i] > 0;
      if (forced) { rem = rem.slice(); rem[i]--; }
      h -= p.units[i];
      steps.push({ type: "spend", amount: p.units[i], hold: h, total: c, forced: forced });
    } else {
      var amt = r[3] === 1 ? p.recvA : bAmount(f);
      var first = r[3] === 2 && !f && p.firstB > 0;
      if (r[3] === 2) f = 1;
      h += amt; c += amt;
      steps.push({ type: "gain", amount: amt, hold: h, total: c, first: first });
    }
    r = go(h, c, f, rem);
  }
  return { final: final, steps: steps, total: c };
}
/*SOLVER-END*/

var reqMap = {};
var REQ_MAX = 9;
function renderReq(p) {
  var box = $("req-rows");
  box.innerHTML = "";
  p.units.slice().reverse().forEach(function (u) {
    if (!isFinite(u) || u < 1) return;
    var n = reqMap[u] || 0;
    var row = document.createElement("div");
    row.className = "req-row";
    var name = document.createElement("span");
    name.className = "name";
    name.textContent = fmt(u) + "p";
    var st = document.createElement("div");
    st.className = "stepper";
    var minus = document.createElement("button");
    minus.type = "button"; minus.textContent = "−"; minus.disabled = n <= 0;
    minus.setAttribute("aria-label", fmt(u) + "pの回数を1減らす");
    var out = document.createElement("output");
    out.textContent = n + "回";
    var plus = document.createElement("button");
    plus.type = "button"; plus.textContent = "+"; plus.disabled = n >= REQ_MAX;
    plus.setAttribute("aria-label", fmt(u) + "pの回数を1増やす");
    minus.addEventListener("click", function () { reqMap[u] = Math.max(0, n - 1); render(); });
    plus.addEventListener("click", function () { reqMap[u] = Math.min(REQ_MAX, n + 1); render(); });
    st.appendChild(minus); st.appendChild(out); st.appendChild(plus);
    row.appendChild(name); row.appendChild(st);
    box.appendChild(row);
  });
}
var ids = ["hold", "remain", "recvA", "recvB", "firstB", "capHold"];
var KEY = "point-carry-v6";
function $(id) { return document.getElementById(id); }
function fmt(n) { return n.toLocaleString("ja-JP"); }

function read() {
  var p = {};
  for (var i = 0; i < ids.length; i++) {
    var v = $(ids[i]).value.trim();
    p[ids[i]] = v === "" ? NaN : Number(v);
  }
  p.usedFirst = $("usedFirst").getAttribute("aria-pressed") === "true";
  p.reqMap = reqMap;
  var seen = {};
  p.units = $("units").value.split(/[\s,、，]+/).filter(function (t) { return t !== ""; }).map(Number)
    .filter(function (n) { if (seen[n]) return false; seen[n] = 1; return true; })
    .sort(function (a, b) { return b - a; });
  p.req = p.units.map(function (u) { return reqMap[u] || 0; });
  return p;
}

function validate(p) {
  for (var i = 0; i < ids.length; i++) {
    var v = p[ids[i]];
    if (!isFinite(v) || v < 0 || Math.floor(v) !== v) return "すべての欄に0以上の整数を入れてください。";
  }
  if (p.recvA < 1) return "受け取り額 A は1以上にしてください。";
  if (p.units.length === 0) return "消化に使う単位を1つ以上選んでください。";
  if (p.units.length > 6) return "消化できる単位は6つまでにしてください。";
  for (var j = 0; j < p.units.length; j++) {
    var u = p.units[j];
    if (!isFinite(u) || u < 1 || Math.floor(u) !== u) return "消化できる単位は1以上の整数を、カンマで区切って入れてください（例：250, 400, 800）。";
  }
  var minU = Math.min.apply(null, p.units);
  var minR = p.recvB > 0 ? Math.min(p.recvA, p.recvB) : p.recvA;
  if (p.recvB > 0 && p.firstB > 0) minR = Math.min(minR, p.firstB);
  var reqSum = p.req.reduce(function (a, n) { return a + n; }, 0);
  var depth = reqSum + p.hold / minU + (p.remain + p.capHold) / minR + (p.remain + p.capHold) / minU;
  if (depth > 3000) return "数値の差が大きすぎて計算できません。受け取り額や消化の単位を大きくするか、所持・上限を小さくしてください。";
  return "";
}

function render() {
  var p = read();
  syncUnits();
  renderReq(p);
  var showFirst = p.recvB > 0 && p.firstB > 0;
  $("first-row").hidden = !showFirst;
  if (showFirst) $("usedFirst").textContent = "初回の" + p.firstB + "pはもう受け取った";
  capBtns.forEach(function (b) { b.setAttribute("aria-pressed", p.remain === +b.dataset.cap ? "true" : "false"); });
  var out = $("out");
  var err = validate(p);
  if (err) {
    out.innerHTML = '<div class="error" role="alert"></div>';
    out.firstChild.textContent = err;
    $("rules").innerHTML = "";
    return;
  }
  try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e) {}

  var res = solve(p);
  if (res.final === null) {
    out.innerHTML = '<div class="error" role="alert">指定した回数ぶんを消化しきれません。必ず消化する回数を減らすか、所持・残り受け取れるポイントを確認してください。</div>';
    $("rules").innerHTML = "";
    return;
  }
  var gains = res.steps.filter(function (s) { return s.type === "gain"; });
  var spends = res.steps.length - gains.length;
  var spendSum = res.steps.reduce(function (a, s) { return a + (s.type === "spend" ? s.amount : 0); }, 0);
  var gainSum = gains.reduce(function (a, s) { return a + s.amount; }, 0);

  var html = '<div style="display:flex;flex-direction:column;gap:16px">';
  html += '<section class="result" aria-live="polite"><span class="cap">持ち越せる最大</span>' +
    '<span class="big">' + fmt(res.final) + '<small>p</small></span>' +
    '<span class="sub"><span>受け取り ' + gains.length + '回（+' + fmt(gainSum) + 'p）</span>' +
    '<span>消化 ' + spends + '回（−' + fmt(spendSum) + 'p）</span></span></section>';

  html += '<section class="card"><h2>手順</h2>';
  if (res.steps.length === 0) {
    html += '<p class="hint">これ以上受け取っても消化しても増えません。いまの所持が最大です。</p>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>#</th><th>操作</th><th>所持</th><th>残り受取</th></tr></thead><tbody>';
    html += '<tr><td></td><td>スタート</td><td>' + fmt(p.hold) + '</td><td>' + fmt(p.remain) + '</td></tr>';
    res.steps.forEach(function (s, i) {
      var last = i === res.steps.length - 1 ? ' class="last"' : "";
      var pill = s.type === "gain"
        ? '<span class="pill gain">受取 +' + fmt(s.amount) + '</span>' + (s.first ? '<span class="tag">初回</span>' : "")
        : '<span class="pill spend">消化 −' + fmt(s.amount) + '</span>' + (s.forced ? '<span class="tag">指定</span>' : "");
      html += "<tr" + last + "><td>" + (i + 1) + "</td><td>" + pill + "</td><td>" + fmt(s.hold) + "</td><td>" + fmt(Math.max(0, p.remain - s.total)) + "</td></tr>";
    });
    html += "</tbody></table></div>";
    html += '<p class="hint">同じ最大値になるやり方が複数あるときは、受け取り合計がいちばん多く、その中で操作回数が少ないものを1つ表示しています。</p>';
  }
  html += "</section></div>";
  out.innerHTML = html;

  var amt = p.recvB > 0 && p.recvB !== p.recvA ? fmt(p.recvA) + "p か " + fmt(p.recvB) + "p" : fmt(p.recvA) + "p";
  var firstRule = p.recvB > 0 && p.firstB > 0 ? [p.usedFirst
    ? "初回の " + fmt(p.firstB) + "p は受け取り済みなので、" + fmt(p.recvB) + "p で計算する。"
    : fmt(p.recvB) + "p のほうは、1回目だけ " + fmt(p.firstB) + "p になる（2回目からは " + fmt(p.recvB) + "p）。"] : [];
  syncPresets(p);
  var reqSum = p.req.reduce(function (a, n) { return a + n; }, 0);
  var rules = [
    "1回の受け取りは " + amt + "。"
  ].concat(firstRule, [
    "残り受け取れるポイントは " + fmt(p.remain) + "p からスタート。残りが1p以上あれば受け取れて、最後の1回は残りを超えて受け取れる。残りが0になったら受け取れない。",
    "所持が " + fmt(p.capHold) + "p を超えている間は受け取れない（消化して " + fmt(p.capHold) + "p 以下に戻せば受け取れる）。",
    "消化は1回につき " + p.units.slice().reverse().map(fmt).join("p・") + "p のどれかで、いつでも何回でもできる。",
    "スタート時の所持は、残り受け取れるポイントとは別に数える。"
  ]).concat(reqSum > 0 ? ["必ず消化する回数：" + p.units.slice().reverse().filter(function (u) { return reqMap[u] > 0; }).map(function (u) { return fmt(u) + "p×" + reqMap[u] + "回"; }).join("、") + "。これ以上消化してもよい。"] : [
  ]);
  var ul = $("rules");
  ul.innerHTML = "";
  rules.forEach(function (t) { var li = document.createElement("li"); li.textContent = t; ul.appendChild(li); });
}

var presetBtns = Array.prototype.slice.call(document.querySelectorAll("#preset-group button"));
$("usedFirst").addEventListener("click", function () {
  var b = $("usedFirst");
  b.setAttribute("aria-pressed", b.getAttribute("aria-pressed") === "true" ? "false" : "true");
  render();
});
var capBtns = Array.prototype.slice.call(document.querySelectorAll("#cap-group button"));
capBtns.forEach(function (b) {
  b.addEventListener("click", function () { $("remain").value = b.dataset.cap; render(); });
});
var unitBtns = Array.prototype.slice.call(document.querySelectorAll("#unit-group button"));
function syncUnits() {
  var cur = read().units;
  unitBtns.forEach(function (b) {
    b.setAttribute("aria-pressed", cur.indexOf(+b.dataset.u) >= 0 ? "true" : "false");
  });
}
unitBtns.forEach(function (b) {
  b.addEventListener("click", function () {
    var u = +b.dataset.u;
    var cur = read().units.filter(function (n) { return isFinite(n); });
    var i = cur.indexOf(u);
    if (i >= 0) cur.splice(i, 1); else cur.push(u);
    cur.sort(function (a, c) { return a - c; });
    $("units").value = cur.join(", ");
    render();
  });
});
function syncPresets(p) {
  presetBtns.forEach(function (b) {
    var on = p.recvA === +b.dataset.a && p.recvB === +b.dataset.b && p.firstB === +b.dataset.f;
    b.setAttribute("aria-pressed", on ? "true" : "false");
  });
}
presetBtns.forEach(function (b) {
  b.addEventListener("click", function () {
    $("recvA").value = b.dataset.a; $("recvB").value = b.dataset.b;
    $("firstB").value = b.dataset.f;
    render();
  });
});
try {
  var saved = JSON.parse(localStorage.getItem(KEY) || "null");
  if (saved) {
    ids.forEach(function (id) { if (typeof saved[id] === "number" && isFinite(saved[id])) $(id).value = saved[id]; });
    if (saved.reqMap && typeof saved.reqMap === "object") {
      Object.keys(saved.reqMap).forEach(function (k) {
        var n = saved.reqMap[k];
        if (typeof n === "number" && n >= 0 && n <= REQ_MAX && Math.floor(n) === n) reqMap[k] = n;
      });
    }
    if (saved.usedFirst === true) $("usedFirst").setAttribute("aria-pressed", "true");
    if (Array.isArray(saved.units) && saved.units.length) $("units").value = saved.units.slice().reverse().join(", ");
  }
} catch (e) {}
ids.concat(["units"]).forEach(function (id) { $(id).addEventListener("input", render); });
render();
</script>
</body>
</html>
